[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacticlens"
version = "0.1.0"
description = "AI match-intelligence engine on Azure: synthetic football events to grounded, personalized, accessible match storytelling."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
